name: Test

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: [17, 18, 19]
      fail-fast: false

    name: Test (React ${{ matrix.react-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install React ${{ matrix.react-version }}
        working-directory: packages/core
        run: pnpm add -D react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}

      - name: Run tests
        working-directory: packages/core
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:core
