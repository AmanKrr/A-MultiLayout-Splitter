name: Test

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - react-version: 17
            testing-library-version: 12
          - react-version: 18
            testing-library-version: 14
          - react-version: 19
            testing-library-version: 16
      fail-fast: false

    name: Test (React ${{ matrix.react-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install React ${{ matrix.react-version }} and compatible Testing Library
        working-directory: packages/core
        run: |
          pnpm add -D react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} @testing-library/react@${{ matrix.testing-library-version }}

      - name: Run tests
        working-directory: packages/core
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:core
